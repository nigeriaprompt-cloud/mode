<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mode · Personal Operating System</title>
<meta name="description" content="Mode is a private, offline-first personal operating system for prayer, fitness, business, career and discipline. Your data never leaves your device.">
<meta name="theme-color" content="#060f2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mode">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="modulepreload" href="js/app.js">
<style>html,body{margin:0;background:#060f2b}#splash{position:fixed;inset:0;background:#060f2b;z-index:999}</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <canvas id="splash-fx"></canvas>
  <div class="splash-core">
    <div class="orbit"><i></i><i></i><i></i><img class="splash-logo" src="assets/logo.svg" alt="" width="84" height="84"></div>
    <div class="splash-word mono">MODE</div>
    <pre id="boot" class="mono"></pre>
  </div>
</div>

<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <div class="top-title"><h2 id="ptitle">Mode</h2><span id="pdate" class="mono muted"></span></div>
      <span class="grow"></span>
      <div class="top-actions" id="topActions"></div>
    </header>
    <main id="view" class="page" tabindex="-1"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
  <button class="fab" id="fab" aria-label="Quick add activity" title="Quick add (N)"></button>
</div>
<noscript><p style="color:#fff;padding:2rem;font-family:sans-serif">Mode needs JavaScript to run. It stores everything privately in your browser.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
